name: CI

on:
  push:
    branches:
      - main
      - feature/storage-improvements
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # The catch-all step runs the full tests/ tree (~647 UI/storage/process
    # tests, led by Qt theme and contrast checks). 20 minutes was sized for the
    # six sidecar suites alone; raise it so restored coverage cannot trip the
    # job ceiling.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
        python:
          - "3.10"
          - "3.12"

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-timeout

      - name: Compile source
        run: python -m compileall -q src

      # Run per-file with a hard timeout so a hanging test fails fast and
      # identifies itself instead of consuming the whole job timeout.
      - name: Run tests
        if: always()
        run: python -m pytest -q -ra --timeout=120 --timeout-method=thread tests/test_sidecar_stage0.py

      - name: Run tests (adapters)
        if: always()
        run: python -m pytest -q -ra --timeout=120 --timeout-method=thread tests/test_sidecar_adapters.py

      - name: Run tests (startup adapter)
        if: always()
        run: python -m pytest -q -ra --timeout=120 --timeout-method=thread tests/test_startup_adapter.py

      - name: Run tests (integration)
        if: always()
        run: python -m pytest -q -ra --timeout=120 --timeout-method=thread tests/test_sidecar_integration.py

      - name: Run tests (packaging)
        if: always()
        run: python -m pytest -q -ra --timeout=120 --timeout-method=thread tests/test_sidecar_packaging.py

      - name: Run tests (parent watchdog)
        if: always()
        run: python -m pytest -q -ra --timeout=120 --timeout-method=thread tests/test_parent_watchdog.py

      - name: Run tests (frozen entrypoint)
        if: always()
        run: python -m pytest -q -ra --timeout=120 --timeout-method=thread tests/test_run_sidecar_entrypoint.py

      # Catch-all: the per-file steps above cover the sidecar suites whose
      # hangs motivated the timeouts, but they must not replace full-suite
      # coverage. This step runs everything else under tests/ so storage, UI,
      # process and cleanup regressions are still caught.
      - name: Run remaining test suite
        if: always()
        run: >
          python -m pytest -q -ra --timeout=120 --timeout-method=thread tests/
          --ignore=tests/test_sidecar_stage0.py
          --ignore=tests/test_sidecar_adapters.py
          --ignore=tests/test_startup_adapter.py
          --ignore=tests/test_sidecar_integration.py
          --ignore=tests/test_sidecar_packaging.py
          --ignore=tests/test_parent_watchdog.py
          --ignore=tests/test_run_sidecar_entrypoint.py

  package-windows:
    name: Package smoke test (Windows, Python 3.12)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows executable
        run: python build_installer.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist\PantherApp\PantherApp.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }
